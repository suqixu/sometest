    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f6f0e4; font-family: system-ui, sans-serif; color: #24434a; }
    main { width: min(1000px, 94vw); }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 44px); font-weight: 600; letter-spacing: .06em; }
    p { margin: 0 0 22px; color: #74858a; }
    svg { display: block; width: 100%; height: auto; border-radius: 18px; background: #d9eced; box-shadow: 0 18px 60px #24434a15; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .crank { transform-box: view-box; transform-origin: 500px 395px; animation: spin 1.2s linear infinite; }
    .bird { animation: bob .6s ease-in-out infinite alternate; }
    .scarf { transform-origin: 540px 216px; animation: flutter .45s ease-in-out infinite alternate; }
    .cloud { animation: drift 25s linear infinite; }
    .cloud.two { animation-duration: 33s; animation-delay: -14s; }
    .roadmark { animation: road 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(4px); } }
    @keyframes flutter { to { transform: rotate(-8deg); } }
    @keyframes drift { to { transform: translateX(-1100px); } }
    @keyframes road { to { transform: translateX(-160px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

<script id="mobile-ui-script">
(() => {
  const surfaces = Array.from(document.querySelectorAll("main > h1, main > p, body > a[data-demo-return]"));
  const button = document.createElement('button');
  button.id = 'ui-toggle';
  button.type = 'button';
  button.textContent = '收起 UI';
  button.setAttribute('aria-expanded', 'true');
  surfaces.forEach((surface, index) => {
    surface.classList.add('ui-surface');
    if (!surface.id) surface.id = `ui-surface-${index}`;
  });
  button.setAttribute('aria-controls', surfaces.map(surface => surface.id).join(' '));
  button.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('ui-collapsed');
    button.textContent = collapsed ? '展开 UI' : '收起 UI';
    button.setAttribute('aria-expanded', String(!collapsed));
  });
  document.body.appendChild(button);
})();
</script>

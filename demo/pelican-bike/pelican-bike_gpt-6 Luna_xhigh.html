<style>
  :root { color-scheme: light; --ink:#263e3c; --paper:#f3eddf; --soft:#7c8980; --rust:#d66e4e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:clamp(18px,4vw,48px); background:var(--paper); color:var(--ink); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; }

  .seal { display:grid; width:27px; height:27px; place-items:center; border:1px solid #263e3c88; border-radius:50%; font-family:Georgia,serif; font-size:14px; letter-spacing:0; }

  svg { display:block; width:100%; height:auto; }
  footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 1px 0; }
  .status { color:var(--soft); font-size:10px; letter-spacing:.1em; }
  .status::before { content:""; display:inline-block; width:6px; height:6px; margin:0 9px 1px 0; border-radius:50%; background:var(--rust); }
  button { border:1px solid #263e3c66; border-radius:40px; padding:8px 15px; background:transparent; color:var(--ink); font:inherit; font-size:10px; letter-spacing:.08em; cursor:pointer; }

  button:focus-visible { outline:3px solid var(--rust); outline-offset:3px; }
  .spokes { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }

  .cloud-two { animation:clouds 53s linear infinite reverse; }
  .road-dash { animation:road 1.7s linear infinite; }
  .bird { transform-box:fill-box; transform-origin:center; animation:bob .75s ease-in-out infinite alternate; }
  .scarf-end { transform-box:fill-box; transform-origin:right center; animation:flap .55s ease-in-out infinite alternate; }
  .pedals,.legs { transform-box:view-box; transform-origin:530px 420px; animation:spin 1.2s linear infinite; }
  .stopped *, .stopped *::before, .stopped *::after { animation-play-state:paused !important; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes clouds { to { transform:translateX(-1120px); } }
  @keyframes road { to { transform:translateX(-180px); } }
  @keyframes bob { to { transform:translateY(2px); } }
  @keyframes flap { to { transform:rotate(-9deg); } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  @media (max-width:620px) {
    body { padding:19px 15px; }

    .frame { border-radius:11px; }
    .status { font-size:9px; letter-spacing:.04em; }
    button { padding:8px 11px; }
  }
</style>

<script>
  const scene = document.getElementById('scene');
  const toggle = document.getElementById('toggle');
  const status = document.getElementById('status');
  toggle.addEventListener('click', () => {
    const paused = scene.classList.toggle('stopped');
    toggle.textContent = paused ? '继续动画' : '暂停动画';
    toggle.setAttribute('aria-pressed', String(paused));
    status.textContent = paused ? '路边歇一会儿　·　准备好再出发' : '海风正好　·　正在慢慢前行';
  });
</script>

})();

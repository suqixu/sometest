  <div class="intro"><p class="eyebrow">A LITTLE RIDE, A LITTLE JOY</p><h1>把下午，交给海风。</h1><p class="subtitle">一只鹈鹕，两个轮子。今天不赶路。</p></div>

      <path d="M0 445Q236 422 483 442T1000 441V560H0Z" fill="#e8ddc2"/>

      <g id="road" stroke="#c0b59b" stroke-width="3" stroke-linecap="round"><path d="M0 532H70M160 532H230M320 532H390M480 532H550M640 532H710M800 532H870M960 532H1030M1120 532H1190"/></g>

      <ellipse cx="525" cy="496" rx="241" ry="12" fill="#294846" opacity=".1"/>

      <!-- 自行车 -->
      <g transform="translate(354 410)"><use href="#tire"/><g id="rear-spokes"><use href="#wheel-spokes"/></g><circle r="7" fill="#294846"/></g>
      <g transform="translate(697 410)"><use href="#tire"/><g id="front-spokes"><use href="#wheel-spokes"/></g><circle r="7" fill="#294846"/></g>
      <path d="M275 391A82 82 0 0 1 419 354M628 359A82 82 0 0 1 777 391" fill="none" stroke="#718f75" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" stroke="#417c69" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"><path d="M354 410L445 315L516 410H354L619 308L445 315M516 410L619 308L697 410"/><path d="M445 315L435 292M619 308L605 267"/></g>
      <path d="M417 291Q441 286 463 291" fill="none" stroke="#294846" stroke-width="12" stroke-linecap="round"/>
      <path d="M605 267L618 243H648Q664 243 664 255" fill="none" stroke="#294846" stroke-width="7" stroke-linecap="round"/>
      <path d="M651 245Q675 278 662 313" fill="none" stroke="#7f9381" stroke-width="1.6"/>

      <g id="bird">

        <path d="M554 193Q533 216 546 242Q553 265 524 282" fill="none" stroke="#e0e6d9" stroke-width="10" stroke-linecap="round"/>

        <path d="M526 207Q539 218 556 210L561 224Q543 238 521 222Z" fill="#df805e" stroke="#a65040" stroke-width="2"/>
        <path d="M492 244Q537 278 574 264L629 244" fill="none" stroke="#294846" stroke-width="15" stroke-linecap="round"/>

  <footer><p class="note">今日目的地：有风的地方。</p><div class="controls"><button id="speed" type="button" aria-label="切换骑行速度，当前为一倍">1 ×</button><button id="pause" type="button" aria-pressed="false">Ⅱ 暂停片刻</button></div></footer>
</main>
<script>
  (() => {
    const el = id => document.getElementById(id);
    const nodes = Object.fromEntries(['far-leg','near-leg','far-foot','near-foot','crank','rear-spokes','front-spokes','bird','eye','scarf','road','plants','clouds-back','clouds-front','wind','waves'].map(id => [id, el(id)]));
    const pause = el('pause'), speed = el('speed');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    const speeds = [1, 1.5, 0.65];
    let paused = motionPreference.matches, speedIndex = 0, elapsed = 0, lastTime = null, frameId = null;
    const transform = (id, value) => nodes[id].setAttribute('transform', value);

    // 两段等长腿的几何解，让脚掌始终贴合踏板。
    function leg(id, hipX, hipY, footX, footY) {
      const dx = footX - hipX, dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const bend = Math.sqrt(Math.max(0, 86 * 86 - distance * distance / 4));
      const kneeX = (hipX + footX) / 2 + dy / distance * bend;
      const kneeY = (hipY + footY) / 2 - dx / distance * bend;
      nodes[id].setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`);
    }

    function draw(time) {
      const phase = time / 1400 * Math.PI * 2;
      const bob = Math.sin(phase * 2) * 1.8;
      const x = 516 + Math.cos(phase) * 31, y = 410 + Math.sin(phase) * 31;
      const farX = 1032 - x, farY = 820 - y;
      leg('near-leg', 478, 282 + bob, x, y - 8);
      leg('far-leg', 466, 280 + bob, farX, farY - 8);
      transform('near-foot', `translate(${x} ${y - 8})`);
      transform('far-foot', `translate(${farX} ${farY - 8})`);
      nodes.crank.setAttribute('d', `M${farX} ${farY}L${x} ${y}`);
      transform('rear-spokes', `rotate(${phase * 180 / Math.PI})`);
      transform('front-spokes', `rotate(${phase * 180 / Math.PI})`);
      transform('bird', `translate(0 ${bob})`);
      transform('scarf', `rotate(${Math.sin(phase * 2.6) * 4} 539 219)`);
      const blink = time % 5100;
      const eyeScale = blink > 4700 && blink < 4870 ? .12 : 1;
      transform('eye', `translate(576 152) scale(1 ${eyeScale}) translate(-576 -152)`);
      transform('road', `translate(${-time / 1400 * 160 % 160} 0)`);
      transform('plants', `translate(${-time / 1400 * 160 % 1100} 0)`);
      transform('clouds-back', `translate(${-time / 110 % 1100} 0)`);
      transform('clouds-front', `translate(${-time / 65 % 1100} 0)`);
      nodes.wind.setAttribute('opacity', .5 + Math.sin(phase) * .25);
      nodes.waves.setAttribute('opacity', .65 + Math.sin(time / 1800) * .15);
    }

    function frame(now) {
      if (paused || document.hidden) { frameId = null; lastTime = null; return; }
      if (lastTime !== null) elapsed += Math.min(now - lastTime, 80) * speeds[speedIndex];
      lastTime = now;
      draw(elapsed);
      frameId = requestAnimationFrame(frame);
    }

    function sync() {
      pause.textContent = paused ? '▶ 继续兜风' : 'Ⅱ 暂停片刻';
      pause.setAttribute('aria-pressed', String(paused));
      if (paused || document.hidden) {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null; lastTime = null;
      } else if (frameId === null) frameId = requestAnimationFrame(frame);
    }

    pause.addEventListener('click', () => { paused = !paused; sync(); });
    speed.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      speed.textContent = `${speeds[speedIndex]} ×`;
      speed.setAttribute('aria-label', `切换骑行速度，当前为${speeds[speedIndex]}倍`);
    });
    motionPreference.addEventListener('change', event => { paused = event.matches; sync(); });
    document.addEventListener('visibilitychange', sync);
    draw(0); sync();
  })();
</script>

<script id="mobile-ui-script">
(() => {

  const button = document.createElement('button');
  button.id = 'ui-toggle';
  button.type = 'button';
  button.textContent = '收起 UI';
  button.setAttribute('aria-expanded', 'true');
  surfaces.forEach((surface, index) => {

    if (!surface.id) surface.id = `ui-surface-${index}`;
  });
  button.setAttribute('aria-controls', surfaces.map(surface => surface.id).join(' '));
  button.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('ui-collapsed');
    button.textContent = collapsed ? '展开 UI' : '收起 UI';
    button.setAttribute('aria-expanded', String(!collapsed));
  });
  document.body.appendChild(button);
})();
</script>

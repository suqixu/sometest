  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1, time = 0, last = null, frame = null;
      const crank = $('crank'), bird = $('bird');
      const rear = $('rear-wheel'), front = $('front-wheel');
      const farLeg = $('far-leg'), nearLeg = $('near-leg'), highlight = $('near-leg-highlight');
      const farFoot = $('far-foot'), nearFoot = $('near-foot'), pedal = $('near-pedal');
      const clouds = $('clouds'), water = $('water'), road = $('road'), plants = $('plants');
      const scarf = $('scarf-tail'), breeze = $('breeze');
      // Two-segment inverse kinematics keeps each foot attached to its pedal.
      function leg(hip, foot, upper, lower) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + dx * along / distance + dy * bend / distance;
        const kneeY = hip.y + dy * along / distance - dx * bend / distance;
        return `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y}`;
      }
      function draw() {
        const angle = time * 2.7;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 2;
        const near = { x: 594 + Math.cos(angle) * 35, y: 451 + Math.sin(angle) * 35 };
        const far = { x: 594 - Math.cos(angle) * 35, y: 451 - Math.sin(angle) * 35 };
        crank.setAttribute('transform', `translate(594 451) rotate(${degrees})`);
        rear.setAttribute('transform', `rotate(${degrees * 1.65})`);
        front.setAttribute('transform', `rotate(${degrees * 1.65})`);
        bird.setAttribute('transform', `translate(0 ${bob})`);
        nearLeg.setAttribute('d', leg({ x: 565, y: 313 + bob }, near, 95, 100));
        highlight.setAttribute('d', nearLeg.getAttribute('d'));
        farLeg.setAttribute('d', leg({ x: 553, y: 315 + bob }, far, 95, 100));
        nearFoot.setAttribute('d', `M${near.x - 9} ${near.y - 5}Q${near.x + 7} ${near.y - 8} ${near.x + 20} ${near.y + 3}L${near.x - 9} ${near.y + 3}Z`);
        farFoot.setAttribute('d', `M${far.x - 9} ${far.y - 5}Q${far.x + 7} ${far.y - 8} ${far.x + 20} ${far.y + 3}L${far.x - 9} ${far.y + 3}Z`);
        pedal.setAttribute('transform', `translate(${near.x} ${near.y})`);
        scarf.setAttribute('transform', `rotate(${Math.sin(angle * 2.3) * 5} 630 226)`);
        // Repeating SVG copies keep the moving scenery continuous at wrap points.
        const travel = time * 2.7 * 1.65 * 98;
        road.setAttribute('transform', `translate(${-travel % 1500} 0)`);
        plants.setAttribute('transform', `translate(${-travel * .75 % 1500} 0)`);
        clouds.setAttribute('transform', `translate(${-travel * .045 % 1500} 0)`);
        water.setAttribute('transform', `translate(${-travel * .17 % 1500} 0)`);
        breeze.setAttribute('opacity', .5 + Math.sin(angle * 2) * .25);
      }
      [road, plants, clouds, water].forEach(group => {
        const original = [...group.children];
        [-1500, 1500, 3000].forEach(offset => {
          const copy = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          copy.setAttribute('transform', `translate(${offset} 0)`);
          original.forEach(element => copy.appendChild(element.cloneNode(true)));
          group.appendChild(copy);
        });
      });
      function tick(now) {
        frame = null;
        if (!playing || document.hidden) return;
        if (last !== null) time += Math.min((now - last) / 1000, .06) * speed;
        last = now;
        draw();
        frame = requestAnimationFrame(tick);
      }
      function sync() {
        $('play-icon').textContent = playing ? 'Ⅱ' : '▶';
        $('play-label').textContent = playing ? '歇一会儿' : '继续兜风';
        $('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('state-label').textContent = playing ? '海岸骑行中' : '停下来，看看海';
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null; last = null;
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }
      $('toggle').addEventListener('click', () => { playing = !playing; sync(); });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speed-value').value = speed.toFixed(1) + '×';
      });
      document.addEventListener('visibilitychange', sync);
      reducedMotion.addEventListener('change', event => { playing = !event.matches; sync(); });
      draw(); sync();
    })();
  </script>

  surfaces.forEach((surface, index) => {
    surface.classList.add('ui-surface');
    if (!surface.id) surface.id = `ui-surface-${index}`;
  });
  button.setAttribute('aria-controls', surfaces.map(surface => surface.id).join(' '));
  button.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('ui-collapsed');
    button.textContent = collapsed ? '展开 UI' : '收起 UI';
    button.setAttribute('aria-expanded', String(!collapsed));
  });
  document.body.appendChild(button);
})();
</script>
<script id="demo-return-script">
(() => {
  const fallback = 'https://suqixu.github.io/sometest/demo/demo.html';
  document.querySelectorAll('a[data-demo-return]').forEach(link => {
    let pending = false;
    link.addEventListener('click', event => {
      if (event.button || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (pending) return;
      pending = true;
      const destination = new URL(link.getAttribute('href'), location.href);
      const probe = document.createElement('iframe');
      probe.hidden = true;
      const check = new URL(destination);
      check.searchParams.set('demo-return-check', '1');
      let finished = false;
      const finish = url => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        removeEventListener('message', receive);
        probe.remove();
        window.top.location.href = url;
      };
      const receive = event => {
        if (event.source === probe.contentWindow && event.data?.type === 'demo-return-available') {
          finish(destination.href);
        }
      };
      addEventListener('message', receive);
      const timer = setTimeout(() => finish(fallback), 3000);
      probe.src = check.href;
      document.body.appendChild(probe);
    });
  });
})();
</script>

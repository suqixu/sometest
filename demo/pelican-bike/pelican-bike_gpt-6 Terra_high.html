<script>
(()=>{
 const byId=id=>document.getElementById(id), ids=['back-leg','front-leg','back-foot','front-foot','cranks','road','breeze'];
 const n=Object.fromEntries(ids.map(id=>[id,byId(id)])), pause=byId('pause'), speed=byId('speed');
 const rates=[1,1.5,.65]; let rate=0, stopped=matchMedia('(prefers-reduced-motion: reduce)').matches, elapsed=0,last=null,raf=0;
 const trans=(id,v)=>n[id].setAttribute('transform',v);
 function leg(id,hx,hy,fx,fy){const dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy),q=Math.sqrt(Math.max(0,86*86-d*d/4));const kx=(hx+fx)/2+dy/d*q,ky=(hy+fy)/2-dx/d*q;n[id].setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${fx} ${fy}`)}
 function paint(t){const a=t/1100*Math.PI*2,b=Math.sin(a*2)*1.5,x=516+Math.cos(a)*31,y=394+Math.sin(a)*31,bx=1032-x,by=788-y;
  leg('front-leg',478,277+b,x,y-7);leg('back-leg',466,276+b,bx,by-7);trans('front-foot',`translate(${x} ${y-7})`);trans('back-foot',`translate(${bx} ${by-7})`);n.cranks.setAttribute('d',`M${bx} ${by}L${x} ${y}`);
  document.querySelectorAll('g[transform^="translate(342"],g[transform^="translate(695"]').forEach((g,i)=>{const wheel=g.querySelector('.rotor');wheel.setAttribute('transform',`rotate(${a*180/Math.PI})`)});
  trans('road',`translate(${-t/1100*150%150} 0)`);trans('breeze',`translate(${-t/55%100} 0)`);document.querySelector('.cloud-a').setAttribute('transform',`translate(${-t/90%1100} 0)`);document.querySelector('.cloud-b').setAttribute('transform',`translate(${t/110%1100} 0)`);
 }
 function tick(now){if(stopped||document.hidden){raf=0;last=null;return}if(last!==null)elapsed+=Math.min(now-last,70)*rates[rate];last=now;paint(elapsed);raf=requestAnimationFrame(tick)}
 function sync(){pause.textContent=stopped?'▶　继续':'Ⅱ　暂停';pause.setAttribute('aria-pressed',String(stopped));if(stopped||document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=null}else if(!raf)raf=requestAnimationFrame(tick)}
 pause.addEventListener('click',()=>{stopped=!stopped;sync()});speed.addEventListener('click',()=>{rate=(rate+1)%rates.length;speed.textContent=`速度 ${rates[rate]}×`});document.addEventListener('visibilitychange',sync);paint(0);sync();
})();
</script>

<script>
const svg=document.querySelector('svg');
const button=document.getElementById('toggle');
const nearLeg=document.getElementById('near-leg'),farLeg=document.getElementById('far-leg');
const nearFoot=document.getElementById('near-foot'),farFoot=document.getElementById('far-foot');
const crank=document.getElementById('crank-arm');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let time=0,previous=null;
function pose(t){
 const angle=t*2*Math.PI/1400;
 const x=525+33*Math.cos(angle),y=380+33*Math.sin(angle);
 const fx=1050-x,fy=760-y;
 nearLeg.setAttribute('d',`M490 309 Q${514+9*Math.cos(angle)} 333 ${x} ${y-6}`);
 farLeg.setAttribute('d',`M477 305 Q${471-9*Math.cos(angle)} 344 ${fx} ${fy-6}`);
 nearFoot.setAttribute('transform',`translate(${x} ${y})`);
 farFoot.setAttribute('transform',`translate(${fx} ${fy})`);
 crank.setAttribute('d',`M${fx} ${fy}L${x} ${y}`);
 document.querySelectorAll('.wheel').forEach(w=>w.setAttribute('transform',`rotate(${angle*180/Math.PI})`));
}
function sync(){svg.classList.toggle('paused',paused);button.textContent=paused?'▶ 继续兜风':'Ⅱ 暂停片刻';button.setAttribute('aria-pressed',String(paused));}
button.addEventListener('click',()=>{paused=!paused;sync()});
function frame(now){if(previous!==null&&!paused){time+=Math.min(now-previous,60);pose(time)}previous=now;requestAnimationFrame(frame)}
pose(0);sync();requestAnimationFrame(frame);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ 基础：渲染器 / 场景 / 相机 ============================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const FOG_COLOR = new THREE.Color(0xc4dcec);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR, 130, 460);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2200);
camera.position.set(30, 15, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.update();

const clock = new THREE.Clock();
const rand = (a, b) => a + Math.random() * (b - a);

/* ============================ 灯光 ============================ */
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6b8e4a, 0.7);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.28);
scene.add(amb);

const sunLight = new THREE.DirectionalLight(0xfff2d0, 2.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -45;
sunLight.shadow.camera.right = 45;
sunLight.shadow.camera.top = 45;
sunLight.shadow.camera.bottom = -45;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 400;
sunLight.shadow.bias = -0.0004;
scene.add(sunLight);
scene.add(sunLight.target);

/* ============================ 天空穹顶（渐变 + 太阳光晕） ============================ */
const skyUniforms = { uSunDir: { value: new THREE.Vector3(0.5, 0.8, 0.4).normalize() } };
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uSunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y, 0.0, 1.0);
      vec3 top = vec3(0.13, 0.40, 0.86);
      vec3 horizon = vec3(0.80, 0.90, 0.97);
      vec3 col = mix(horizon, top, pow(h, 0.5));
      float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
      col += vec3(1.0, 0.86, 0.55) * pow(sunAmt, 10.0) * 0.55;
      col += vec3(1.0, 0.70, 0.42) * pow(sunAmt, 80.0) * 1.1;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
scene.add(sky);

/* ============================ 太阳（球体 + 光晕 Sprite） ============================ */
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,240,1)');
  g.addColorStop(0.25, 'rgba(255,230,160,0.8)');
  g.addColorStop(0.6, 'rgba(255,180,80,0.25)');
  g.addColorStop(1, 'rgba(255,180,80,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(7, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xfff6d0, fog: false })
);
scene.add(sunMesh);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(), color: 0xffd980,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false
}));
glow.scale.setScalar(110);
scene.add(glow);

/* ============================ 海洋（着色器波浪） ============================ */
const waterUniforms = {
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.5, 0.8, 0.4).normalize() },
  uCameraPos: { value: camera.position }
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vHeight;
    float waveHeight(vec2 p, float t) {
      float h = 0.0;
      h += sin(dot(p, vec2(0.35, 0.42)) + t * 1.1) * 0.55;
      h += sin(dot(p, vec2(-0.50, 0.28)) * 1.4 + t * 0.8) * 0.35;
      h += sin(dot(p, vec2(0.22, -0.48)) * 2.0 + t * 1.4) * 0.22;
      h += sin(dot(p, vec2(0.45, 0.45)) * 3.1 + t * 1.9) * 0.10;
      return h * 0.22;
    }
    void main() {
      vec3 pos = position;
      float h = waveHeight(pos.xz, uTime);
      pos.y += h;
      float e = 0.12;
      float hx1 = waveHeight(vec2(pos.x + e, pos.z), uTime);
      float hx2 = waveHeight(vec2(pos.x - e, pos.z), uTime);
      float hz1 = waveHeight(vec2(pos.x, pos.z + e), uTime);
      float hz2 = waveHeight(vec2(pos.x, pos.z - e), uTime);
      vec3 n = normalize(vec3(-(hx1 - hx2) / (2.0 * e), 1.0, -(hz1 - hz2) / (2.0 * e)));
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorldPos = wp.xyz;
      vNormal = normalize(mat3(modelMatrix) * n);
      vHeight = h;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uSunDir;
    uniform vec3 uCameraPos;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vHeight;
    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(uCameraPos - vWorldPos);
      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 deep = vec3(0.02, 0.27, 0.45);
      vec3 shallow = vec3(0.12, 0.63, 0.68);
      vec3 col = mix(shallow, deep, fresnel);
      vec3 S = normalize(uSunDir);
      vec3 R = reflect(-S, N);
      float spec = pow(max(dot(R, V), 0.0), 90.0);
      col += vec3(1.0, 0.90, 0.70) * spec * 1.6;
      col += vec3(0.10, 0.35, 0.52) * fresnel * 0.45;
      float foam = smoothstep(0.14, 0.26, vHeight);
      col = mix(col, vec3(0.96, 0.98, 1.0), foam * 0.35);
      // 距离雾化，与天空地平线融合
      float dist = length(uCameraPos - vWorldPos);
      float fogF = smoothstep(150.0, 440.0, dist);
      col = mix(col, vec3(0.77, 0.86, 0.93), fogF);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const oceanGeo = new THREE.PlaneGeometry(700, 700, 200, 200);
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, waterMat);
ocean.position.y = 0;
scene.add(ocean);

/* ============================ 岛屿：沙滩 + 草地 ============================ */
function makeDisplacedCylinder(radius, height, color, seed) {
  const geo = new THREE.CylinderGeometry(radius, radius, height, 48, 4);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const n = Math.sin(x * 0.9 + z * 0.7 + seed) * 0.8
            + Math.sin(x * 1.7 - z * 1.3 + seed * 2.0) * 0.5
            + Math.cos((x + z) * 0.5 + seed) * 0.6;
    const s = 1 + n * 0.11;
    pos.setX(i, x * s);
    pos.setZ(i, z * s);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 1 }));
  m.receiveShadow = true;
  m.castShadow = true;
  return m;
}
const sand = makeDisplacedCylinder(9.0, 1.6, 0xe7d3a1, 1.3);
sand.position.y = -0.2;          // 顶部 y ≈ 0.6
scene.add(sand);
const grass = makeDisplacedCylinder(6.8, 1.2, 0x57a05a, 4.7);
grass.position.y = 0.8;          // 底部 0.2，顶部 ≈ 1.4
scene.add(grass);

/* ============================ 山（带顶点色：绿坡 + 岩顶） ============================ */
function makeMountain(radius, height, seed) {
  const geo = new THREE.ConeGeometry(radius, height, 28, 12);
  const pos = geo.attributes.position;
  const colors = [];
  const green = new THREE.Color(0x4a8c4a);
  const rock = new THREE.Color(0x8b8b82);
  const dirt = new THREE.Color(0x6a7a58);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const r = Math.sqrt(x * x + z * z);
    const n = Math.sin(x * 1.1 + z * 0.9 + seed) * 0.7
            + Math.sin(x * 2.3 - z * 1.7 + seed * 3.0) * 0.4
            + Math.cos(y * 1.6 + seed) * 0.5;
    const s = 1 + n * 0.16 * (0.3 + r / radius);
    pos.setX(i, x * s);
    pos.setZ(i, z * s);
    const t = THREE.MathUtils.clamp((y + height / 2) / height, 0, 1); // 0 底部 → 1 顶部
    let c = green.clone().lerp(dirt, THREE.MathUtils.clamp(t * 2.2, 0, 1));
    c.lerp(rock, THREE.MathUtils.clamp((t - 0.62) * 3.0, 0, 1));
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const mountain = makeMountain(4.4, 7.5, 9.2);
mountain.position.set(1.6, 1.2, -0.9);
scene.add(mountain);
const hill = makeMountain(3.0, 3.8, 21.4);
hill.position.set(-2.9, 1.2, 1.6);
scene.add(hill);

/* ============================ 椰子树 ============================ */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x33883a, roughness: 0.8, side: THREE.DoubleSide });
const coconutMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.7 });

function makeFrond(len, wid) {
  const segs = 8;
  const geo = new THREE.PlaneGeometry(wid, len, 1, segs);
  geo.translate(0, len / 2, 0); // 枢轴移到根部
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = y / len;                    // 0 根部 → 1 叶尖
    pos.setZ(i, pos.getZ(i) - t * t * len * 0.55); // 下垂
    pos.setX(i, pos.getX(i) * (1 - t * 0.7));      // 收窄
  }
  geo.computeVertexNormals();
  return geo;
}

function makeCoconutTree(scale, swayPhase) {
  const g = new THREE.Group();

  // 弯曲树干
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.12, 0.9, 0.05),
    new THREE.Vector3(0.2, 1.8, 0.08),
    new THREE.Vector3(0.26, 2.6, 0.1)
  ]);
  const trunk = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.16, 8, false), trunkMat);
  trunk.castShadow = true;
  g.add(trunk);

  // 树冠：7 片叶子
  const crown = new THREE.Group();
  crown.position.set(0.26, 2.6, 0.1);
  const frondGeo = makeFrond(2.4, 0.5);
  const nLeaves = 7;
  for (let i = 0; i < nLeaves; i++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (i / nLeaves) * Math.PI * 2 + rand(-0.15, 0.15);
    const frond = new THREE.Mesh(frondGeo, leafMat);
    frond.rotation.x = -Math.PI / 2 + 0.5 + rand(-0.1, 0.15);
    pivot.add(frond);
    crown.add(pivot);
  }
  // 顶部几片小叶
  for (let i = 0; i < 3; i++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = rand(0, Math.PI * 2);
    const frond = new THREE.Mesh(makeFrond(1.3, 0.32), leafMat);
    frond.rotation.x = -Math.PI / 2 + rand(0.2, 0.6);
    pivot.add(frond);
    crown.add(pivot);
  }
  g.add(crown);

  // 椰子
  for (let i = 0; i < 3; i++) {
    const coco = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), coconutMat);
    const a = (i / 3) * Math.PI * 2 + rand(-0.3, 0.3);
    coco.position.set(0.26 + Math.cos(a) * 0.22, 2.35, 0.1 + Math.sin(a) * 0.22);
    coco.castShadow = true;
    g.add(coco);
  }

  g.scale.setScalar(scale);
  g.userData.swayPhase = swayPhase;
  return g;
}

const trees = [];
const treeSpots = [
  [4.6, 2.6, 0.6], [-4.1, 3.0, 0.6], [0.6, 4.6, 0.7], [4.2, -3.1, 0.6],
  [-3.6, -4.0, 0.6], [1.6, 1.6, 1.3], [-1.6, -1.7, 1.35], [2.2, -0.6, 1.25]
];
treeSpots.forEach(([x, z, y], i) => {
  const tree = makeCoconutTree(rand(0.85, 1.25), rand(0, Math.PI * 2));
  tree.position.set(x, y, z);
  tree.rotation.y = rand(0, Math.PI * 2);
  tree.userData.phase = rand(0, Math.PI * 2);
  scene.add(tree);
  trees.push(tree);
});

/* ============================ 草地草叶（InstancedMesh，随风摆动） ============================ */
const bladeGeo = new THREE.ConeGeometry(0.06, 0.55, 4);
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x3f9c46, roughness: 0.9 });
const GRASS_COUNT = 380;
const grassBlades = new THREE.InstancedMesh(bladeGeo, bladeMat, GRASS_COUNT);
grassBlades.receiveShadow = true;
const grassData = { x: [], z: [], rotY: [], scale: [], phase: [] };
const dummy = new THREE.Object3D();
for (let i = 0; i < GRASS_COUNT; i++) {
  const a = rand(0, Math.PI * 2);
  const r = Math.sqrt(Math.random()) * 6.0;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  grassData.x.push(x); grassData.z.push(z);
  grassData.rotY.push(rand(0, Math.PI * 2));
  grassData.scale.push(rand(0.7, 1.7));
  grassData.phase.push(rand(0, Math.PI * 2));
  dummy.position.set(x, 1.4, z);
  dummy.rotation.set(0, grassData.rotY[i], 0);
  dummy.scale.set(1, grassData.scale[i], 1);
  dummy.updateMatrix();
  grassBlades.setMatrixAt(i, dummy.matrix);
}
scene.add(grassBlades);

/* ============================ 花朵 ============================ */
const stemMat = new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: 0.9 });
const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.6 });
const flowerColors = [0xff5a6e, 0xff8fab, 0xffffff, 0xffcf5a, 0xc77dff, 0xff7a3d];
const petalGeo = new THREE.SphereGeometry(0.085, 8, 8);
petalGeo.scale(1, 0.32, 0.55);

function makeFlower() {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.034, 0.55, 5), stemMat);
  stem.position.y = 0.27;
  g.add(stem);
  const head = new THREE.Group();
  const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
  const pm = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  for (let i = 0; i < 5; i++) {
    const p = new THREE.Mesh(petalGeo, pm);
    const a = (i / 5) * Math.PI * 2;
    p.position.set(Math.cos(a) * 0.09, 0, Math.sin(a) * 0.09);
    p.rotation.y = -a;
    head.add(p);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), centerMat);
  head.position.y = 0.55;
  head.add(center);
  g.add(head);
  g.userData.phase = rand(0, Math.PI * 2);
  return g;
}
const flowers = [];
for (let i = 0; i < 60; i++) {
  const a = rand(0, Math.PI * 2);
  const r = Math.sqrt(Math.random()) * 5.6;
  const f = makeFlower();
  f.position.set(Math.cos(a) * r, 1.4, Math.sin(a) * r);
  f.scale.setScalar(rand(0.8, 1.5));
  scene.add(f);
  flowers.push(f);
}

/* ============================ 云 ============================ */
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xfbfcff, roughness: 1, metalness: 0 });
function makeCloud() {
  const g = new THREE.Group();
  const n = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const r = rand(2.2, 4.6);
    const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12), cloudMat);
    puff.position.set(rand(-6, 6), rand(-1.2, 1.2), rand(-2.5, 2.5));
    puff.scale.y = 0.62;
    g.add(puff);
  }
  return g;
}
const clouds = [];
for (let i = 0; i < 11; i++) {
  const c = makeCloud();
  c.position.set(rand(-180, 180), rand(28, 52), rand(-180, 180));
  c.scale.setScalar(rand(1.0, 2.2));
  c.userData.speed = rand(0.5, 1.6);
  scene.add(c);
  clouds.push(c);
}

/* ============================ 飞鸟 ============================ */
const birdBodyMat = new THREE.MeshStandardMaterial({ color: 0x555a63, roughness: 0.8 });
const birdWingMat = new THREE.MeshStandardMaterial({ color: 0xeef2f7, roughness: 0.8, side: THREE.DoubleSide });

function makeBird() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.6, 6), birdBodyMat);
  body.rotation.x = Math.PI / 2;
  body.scale.y = 0.55;
  g.add(body);
  const wings = [];
  [-1, 1].forEach(side => {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.12, 0.05, 0);
    const wg = new THREE.PlaneGeometry(0.55, 0.24);
    wg.translate(0.27, 0, 0);
    if (side < 0) wg.scale(-1, 1, 1);
    const w = new THREE.Mesh(wg, birdWingMat);
    w.position.x = side * 0.05;
    pivot.add(w);
    pivot.userData.side = side;
    wings.push(pivot);
    g.add(pivot);
  });
  g.userData.wings = wings;
  return g;
}
const birds = [];
for (let i = 0; i < 6; i++) {
  const b = makeBird();
  b.userData.radius = rand(13, 24);
  b.userData.height = rand(11, 20);
  b.userData.speed = rand(0.18, 0.42);
  b.userData.angle = rand(0, Math.PI * 2);
  b.userData.flapPhase = rand(0, Math.PI * 2);
  b.userData.flapSpeed = rand(6, 10);
  scene.add(b);
  birds.push(b);
}

/* ============================ 动画循环 ============================ */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // 太阳缓慢划弧，带动光照与光晕变化
  const az = t * 0.03;
  const el = 0.72 + Math.sin(t * 0.07) * 0.28;
  const sunDir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  sunMesh.position.copy(sunDir).multiplyScalar(360);
  glow.position.copy(sunDir).multiplyScalar(360);
  sunLight.position.copy(sunDir).multiplyScalar(80);
  sunLight.target.position.set(0, 0, 0);
  const warm = THREE.MathUtils.clamp(1 - el / 1.15, 0, 1);
  sunLight.color.setHSL(0.11, warm * 0.35, 0.96);
  sunLight.intensity = 1.6 + el * 1.7;
  skyUniforms.uSunDir.value.copy(sunDir);
  waterUniforms.uSunDir.value.copy(sunDir);

  // 海洋波浪
  waterUniforms.uTime.value = t;
  waterUniforms.uCameraPos.value.copy(camera.position);

  // 天空跟随相机
  sky.position.copy(camera.position);

  // 云朵飘移
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt * 3;
    if (c.position.x > 210) c.position.x = -210;
  }

  // 椰子树随风摇摆
  for (const tree of trees) {
    tree.rotation.z = Math.sin(t * 0.8 + tree.userData.phase) * 0.035;
    tree.rotation.x = Math.cos(t * 0.7 + tree.userData.phase) * 0.025;
  }

  // 草叶摆动
  for (let i = 0; i < GRASS_COUNT; i++) {
    const sw = Math.sin(t * 2.0 + grassData.phase[i]) * 0.16;
    dummy.position.set(grassData.x[i], 1.4, grassData.z[i]);
    dummy.rotation.set(sw, grassData.rotY[i] + sw * 0.6, 0);
    dummy.scale.set(1, grassData.scale[i], 1);
    dummy.updateMatrix();
    grassBlades.setMatrixAt(i, dummy.matrix);
  }
  grassBlades.instanceMatrix.needsUpdate = true;

  // 花朵摇曳
  for (const f of flowers) {
    f.rotation.z = Math.sin(t * 1.6 + f.userData.phase) * 0.12;
  }

  // 飞鸟：环绕飞行 + 扇翅
  for (const b of birds) {
    b.userData.angle += b.userData.speed * dt;
    const a = b.userData.angle;
    const r = b.userData.radius;
    const baseY = b.userData.height;
    b.position.set(Math.cos(a) * r, baseY + Math.sin(t * 0.9 + b.userData.flapPhase) * 1.2, Math.sin(a) * r);
    b.rotation.y = -a;
    const flap = Math.sin(t * b.userData.flapSpeed + b.userData.flapPhase) * 0.7;
    for (const w of b.userData.wings) {
      w.rotation.z = w.userData.side * flap;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================ 自适应窗口 ============================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script id="demo-return-check-script">
if (parent !== window && new URLSearchParams(location.search).has('demo-return-check')) {
  parent.postMessage({ type: 'demo-return-available' }, '*');
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 导航 · 海岛 & 鹈鹕骑行</title>
<style>
  :root {
    --bg1: #0e2a47;
    --bg2: #1a5d7a;
    --bg3: #2d8f96;
    --ink: #153a52;
    --muted: #7c93a4;
    --accent: #ff9e5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf6ff;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
  }

  .app { display: flex; height: 100vh; }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    width: 300px; flex: 0 0 300px;
    display: flex; flex-direction: column;
    background: rgba(8, 24, 42, .55);
    backdrop-filter: blur(8px);
    border-right: 1px solid rgba(255,255,255,.1);
  }
  .brand { display: flex; gap: 12px; align-items: center; padding: 18px 18px 14px; }
  .brand-emoji { font-size: 30px; line-height: 1; }
  .brand b { font-size: 17px; letter-spacing: 1px; display: block; }
  .brand small { color: var(--muted); font-size: 12px; }
  .brand > div { flex: 1; min-width: 0; }
  #nav-toggle {
    flex: 0 0 auto; min-width: 44px; min-height: 44px; padding: 8px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 10px;
    background: rgba(255,255,255,.1); color: #eaf6ff;
    font: inherit; font-size: 12px; font-weight: 600; line-height: 1.2;
    cursor: pointer; touch-action: manipulation;
  }
  #nav-toggle:focus-visible { outline: 3px solid #ffb96e; outline-offset: 3px; }
  body.nav-collapsed .sidebar .nav, body.nav-collapsed .side-foot { display: none; }

  .nav { flex: 1; overflow-y: auto; padding: 4px 12px 16px; }
  .group {
    margin: 16px 4px 8px; font-size: 12px; letter-spacing: 2px;
    color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 8px;
  }
  .group::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.16); }

  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin: 4px 0; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
    transition: background .15s ease, border-color .15s ease;
  }
  .item:hover { background: rgba(255,255,255,.08); }
  .item.active { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.25); }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item .title { font-size: 14px; font-weight: 600; line-height: 1.3; color: #fff; }
  .item.active .title { color: #ffd9a8; }
  .item .meta { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .item .tag {
    font-size: 10px; letter-spacing: .5px; font-weight: 600; color: #fff;
    background: #2563eb; white-space: nowrap; flex-shrink: 0;
    padding: 1px 7px; border-radius: 999px;
  }
  .item .file { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
  .item-open {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #cfe9ff; text-decoration: none; font-size: 15px;
    background: rgba(255,255,255,.1);
  }
  .item-open:hover { background: rgba(255,255,255,.22); color: #fff; }

  .side-foot { padding: 12px 18px; font-size: 11px; color: var(--muted); line-height: 1.6; border-top: 1px solid rgba(255,255,255,.1); }

  /* ---------- 主区 ---------- */
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .stage-bar {
    height: 50px; flex: 0 0 50px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: rgba(8, 24, 42, .45); border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .stage-title { font-size: 14px; font-weight: 600; letter-spacing: .5px; }
  .stage-file { font-size: 12px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .stage-spacer { flex: 1; }
  .open {
    text-decoration: none; font-size: 13px; font-weight: 600; color: #ffd9a8;
    padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.12);
    transition: background .15s ease;
  }
  .open:hover { background: rgba(255,255,255,.22); }

  .stage-body { flex: 1; position: relative; min-height: 0; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #0a1626; }
  .hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,.6); letter-spacing: 1px;
    background: rgba(8,24,42,.6); padding: 4px 12px; border-radius: 999px;
    pointer-events: none;
  }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 720px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { width: 100%; flex: 0 0 auto; border-right: none; border-bottom: 1px solid rgba(255,255,255,.1); }
    .nav { max-height: 42vh; }
    .stage { height: 58vh; }
  }
</style>
<style id="mobile-ui-style">

/* 移动端布局与可收起 UI；不影响场景动画。 */
#ui-toggle {
  position: fixed; top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right)); z-index: 2147483647;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 88px; min-height: 44px; margin: 0; padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
  background: rgba(20,30,45,.78); color: #fff;
  font: 600 13px/1.2 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  letter-spacing: 0; cursor: pointer; touch-action: manipulation;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
#ui-toggle:focus-visible { outline: 3px solid #ffb96e; outline-offset: 3px; }
body.ui-collapsed .ui-surface { display: none !important; }
@media (max-width: 720px), (max-height: 500px) and (max-width: 950px) {
  html { -webkit-text-size-adjust: 100%; }
  button, a, input { touch-action: manipulation; }
  button, a[href="demo.html"] { min-height: 44px; }
  body > a[href="demo.html"] {
    top: max(12px, env(safe-area-inset-top)) !important;
    left: max(12px, env(safe-area-inset-left)) !important;
    box-sizing: border-box; padding: 10px 12px !important;
    font-size: 12px !important; letter-spacing: 0 !important;
  }
}

#ui-toggle { top: auto; bottom: max(12px, env(safe-area-inset-bottom)); }
.app { height: 100dvh; }
.sidebar { min-height: 0; }
.stage-title, .stage-file { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.open { flex-shrink: 0; }
.hint { max-width: calc(100% - 32px); text-align: center; box-sizing: border-box; }
@media (max-width: 720px), (max-height: 500px) and (max-width: 950px) {
  .app { height: 100dvh; min-height: 0; flex-direction: column; overflow: hidden; }
  .sidebar { width: 100%; flex: 0 0 auto; border-right: 0; }
  .brand { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .brand-emoji { font-size: 24px; }
  .side-foot { display: none; }
  .nav { max-height: 24vh; max-height: 24dvh; overscroll-behavior: contain; padding-bottom: 8px; }
  .item { padding: 8px 10px; }
  .item-open { width: 44px; height: 44px; }
  .stage { height: auto; flex: 1 1 0; min-height: 0; }
  .stage-bar { height: auto; flex: 0 0 auto; min-height: 52px; gap: 8px; padding: 6px 12px; }
  .stage-title { flex: 1; font-size: 12px; }
  .stage-file, .stage-spacer { display: none; }
  .open { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 12px; }
  .hint { bottom: max(64px, env(safe-area-inset-bottom)); font-size: 10px; letter-spacing: 0; }
}
@media (max-height: 500px) and (max-width: 950px) {
  .brand { display: flex; }
  .nav { max-height: 24dvh; }
}
@media (min-width: 951px), (min-width: 721px) and (min-height: 501px) {
  body.nav-collapsed .sidebar { width: 64px; flex-basis: 64px; }
  body.nav-collapsed .brand { padding: 12px 10px; justify-content: center; }
  body.nav-collapsed .brand > div, body.nav-collapsed .brand-emoji { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-emoji">🏝️🚲</span>
      <div><b>Demo 导航</b><small>13 个演示 · 同页预览</small></div>
      <button id="nav-toggle" type="button" aria-controls="nav sideFoot" aria-expanded="true" aria-label="收起导航" title="收起导航">收起</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">点击条目在右侧同页预览；点条目后的 ↗ 可在新标签单独打开。</div>
  </aside>

  <main class="stage">
    <div class="stage-bar">
      <span class="stage-title" id="stageTitle"></span>
      <span class="stage-file" id="stageFile"></span>
      <span class="stage-spacer"></span>
      <a class="open" id="openLink" href="#" target="_blank" rel="noopener">↗ 单独打开</a>
    </div>
    <div class="stage-body">
      <iframe id="frame" title="demo 预览"></iframe>
      <div class="hint">若预览区空白（本地文件限制），请点右上角 ↗ 单独打开</div>
    </div>
  </main>
</div>

<script>
const ITEMS = [
  {
    "file": "island/index_deepseek4pro.html",
    "title": "热带海岛 · 3D 动态场景",
    "tag": "deepseek 4pro",
    "group": "海岛主题"
  },
  {
    "file": "island/index_gpt6-astra-高.html",
    "title": "棕榈来信 · 一座慢慢生活的小岛",
    "tag": "GPT-6 Astra · 高",
    "group": "海岛主题"
  },
  {
    "file": "island/index_opus5.5.html",
    "title": "热带海岛 · Tropical Island",
    "tag": "Opus 5.5",
    "group": "海岛主题"
  },
  {
    "file": "pelican-bike/pelican-bicycle_kimi_k3.html",
    "title": "The Pelican Courier · 鹈鹕骑行",
    "tag": "Kimi K3",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Astra_high.html",
    "title": "鹈鹕的海岸骑行",
    "tag": "Astra · high",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Astra_medium.html",
    "title": "鹈鹕的海岸骑行",
    "tag": "Astra · medium",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Astra_low.html",
    "title": "鹈鹕的海岸骑行",
    "tag": "Astra · low",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Luna_high.html",
    "title": "沿着海岸慢慢骑 · 鹈鹕骑行记",
    "tag": "Luna · high",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Luna_xhigh.html",
    "title": "鹈鹕骑行俱乐部 · 海岸慢游",
    "tag": "Luna · xhigh",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Soul_medium.html",
    "title": "鹈鹕骑自行车",
    "tag": "Soul · medium",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican-bike_gpt-6 Terra_high.html",
    "title": "鹈鹕的海边兜风",
    "tag": "Terra · high",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "pelican-bike/pelican_bike_hy4.html",
    "title": "鹈鹕骑自行车 · SVG 2D Animation",
    "tag": "HY4 · SVG",
    "group": "鹈鹕骑行主题"
  },
  {
    "file": "racing/deepseek-4.1-flash.html",
    "title": "四驱赛车 · 随机赛道生成器",
    "tag": "deepseek 4.1 flash",
    "group": "其他演示"
  }
];

const nav = document.getElementById('nav');
const frame = document.getElementById('frame');
const stageTitle = document.getElementById('stageTitle');
const stageFile = document.getElementById('stageFile');
const openLink = document.getElementById('openLink');

const groups = [...new Set(ITEMS.map(item => item.group))];
const groupEmoji = { '海岛主题': '🏝️', '鹈鹕骑行主题': '🚲' };

function hrefOf(file) { return file.split('/').map(encodeURIComponent).join('/'); }

function renderList() {
  nav.innerHTML = '';
  groups.forEach(g => {
    const h = document.createElement('div');
    h.className = 'group';
    h.textContent = `${groupEmoji[g] || '📄'} ${g}`;
    nav.appendChild(h);

    ITEMS.filter(it => it.group === g).forEach(it => {
      const href = hrefOf(it.file);

      const item = document.createElement('div');
      item.className = 'item';
      item.dataset.file = it.file;

      const main = document.createElement('div');
      main.className = 'item-main';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = it.title;
      const meta = document.createElement('span');
      meta.className = 'meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = it.tag;
      const file = document.createElement('span');
      file.className = 'file';
      file.textContent = it.file;
      meta.append(tag, file);
      main.append(title, meta);

      const open = document.createElement('a');
      open.className = 'item-open';
      open.href = href;
      open.target = '_blank';
      open.rel = 'noopener';
      open.title = '新标签单独打开';
      open.textContent = '↗';

      item.append(main, open);
      item.addEventListener('click', e => {
        if (e.target.closest('.item-open')) return;
        select(it);
      });
      nav.appendChild(item);
    });
  });
}

function select(it) {
  const href = hrefOf(it.file);
  frame.src = href;
  stageTitle.textContent = it.title;
  stageFile.textContent = it.file;
  openLink.href = href;

  document.querySelectorAll('.item').forEach(el => {
    el.classList.toggle('active', el.dataset.file === it.file);
  });
}

if (!new URLSearchParams(location.search).has('demo-return-check')) {
  renderList();
  if (ITEMS.length) select(ITEMS[0]);
}
</script>

<script id="navigation-toggle-script">
(() => {
  const toggle = document.getElementById('nav-toggle');
  toggle.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    toggle.textContent = collapsed ? '展开' : '收起';
    toggle.setAttribute('aria-expanded', String(!collapsed));
    const label = collapsed ? '展开导航' : '收起导航';
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
  });
})();
</script>

<script id="mobile-ui-script">
(() => {
  const surfaces = Array.from(document.querySelectorAll(".sidebar, .stage-bar, .hint"));
  const button = document.createElement('button');
  button.id = 'ui-toggle';
  button.type = 'button';
  button.textContent = '收起 UI';
  button.setAttribute('aria-expanded', 'true');
  surfaces.forEach((surface, index) => {
    surface.classList.add('ui-surface');
    if (!surface.id) surface.id = `ui-surface-${index}`;
  });
  button.setAttribute('aria-controls', surfaces.map(surface => surface.id).join(' '));
  button.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('ui-collapsed');
    button.textContent = collapsed ? '展开 UI' : '收起 UI';
    button.setAttribute('aria-expanded', String(!collapsed));
  });
  document.body.appendChild(button);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>返回 Demo 导航</title>
<script>
const destination = 'https://suqixu.github.io/sometest/demo/demo.html';
// 默认导航本身若也不存在，停止自动跳转，避免循环刷新。
if (location.href.split(/[?#]/)[0] !== destination) location.replace(destination);
</script>
</head>
<body>
<p>页面不存在，正在返回 <a href="https://suqixu.github.io/sometest/demo/demo.html">Demo 导航</a>。</p>
<p>若导航页也无法访问，请稍后重试。</p>
</body>
</html>
